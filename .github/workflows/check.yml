name: Verify and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python verify.py
      - run: python package.py
      - uses: actions/upload-artifact@v4
        with:
          name: WaypointUIRestedXPSync
          path: dist/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WaypointUIRestedXPSync
          path: dist
      - name: Check tag matches packaged version
        env:
          TAG: ${{ github.ref_name }}
        run: test -f "dist/WaypointUIRestedXPSync-${TAG#v}.zip"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.zip --verify-tag --draft --title "$TAG" --notes-file CHANGELOG.md
