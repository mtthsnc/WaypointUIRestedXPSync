name: Package release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python package.py
      - uses: actions/upload-artifact@v4
        with:
          name: WaypointUIRestedXPSync
          path: dist/*.zip
